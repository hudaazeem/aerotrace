<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AeroTrace | Symptom Logger</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar">
            <a href = "index.html" class="logo"><span class="aero">Aero</span><span class="trace">Trace</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="logger.html" class="active">Log Symptoms</a>
                <a href="analytics.html">Analytics</a>
            </div>
        </nav>
        <main class="page-container">
            <div class="page-heading">
                <h1>How are you feeling?</h1>
                <p>Log your symptoms to discover possible environmental patterns.</p>
            </div>

            <section class="content-card">
                <h2>Log Symptoms</h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="symptoms"> Choose symptoms:</label>
                        <select name="symptoms[]" id="symptoms" multiple>
                            <option value="running-nose">Running nose</option>
                            <option value="headache">Headache</option>
                            <option value="hives">Hives</option>
                            <option value="itching">Itching</option>
                            <option value="swelling">Swelling</option>
                            <option value="wheezing">Wheezing</option>
                            <option value="shortness-of-breath">Shortness of Breath</option>
                            <option value="nausea">Nausea</option>
                            <option value="dizziness">Dizziness</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Select a date:</label>
                        <input type="date" id="date">
                    </div>

                    <div class="form-group">
                        <label for="timing">Time of day:</label>
                        <select name="timing" id="timing">
                            <option value="morning">Morning</option>
                            <option value="afternoon">Afternoon</option>
                            <option value="evening">Evening</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label for="severity">Severity:</label>
                        <select name="severity" id="severity">
                            <option value="1">1 - Very Mild</option>
                            <option value="2">2 - Mild</option>
                            <option value="3">3 - Moderate</option>
                            <option value="4">4 - Severe</option>
                            <option value="5">5 - Very Severe</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="location">Location:</label>
                        <input type = "text" id="location" placeholder="Enter ZIP code" maxlength="5" inputmode="numeric" pattern="[0-9]{5}">
                    </div>
                    <div class="form-group full-width checkbox-group">
                        <label><input type="checkbox" id="loggingNow"> I'm experiencing these symptoms right now.</label>

                        <label><input type="checkbox" id="noSymptoms"> I'm not experiencing any symptoms.</label>
                    </div>
                </div>
                <button id="submit" class="primary-button">Add symptoms</button>
            </section>
            <section class="content-card history-section">
                <div class="section-heading">
                    <h2>Symptom History</h2>
                    <a href="analytics.html" class="text-link">View analytics →</a>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Symptom</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Severity</th>
                                <th>Location</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="symptomList">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    <script src="script.js"></script>
    </body>
</html>
